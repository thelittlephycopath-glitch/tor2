# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8

# Parallelize independent Gradle tasks on CI; Gradle still respects task dependencies.
org.gradle.parallel=true
org.gradle.workers.max=2

# Reuse task outputs and configuration where inputs permit.
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin code style for this project.
kotlin.code.style=official
