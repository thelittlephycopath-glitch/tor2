name: Diagnose Tor VPN Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Build and capture compiler diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free unused preinstalled runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # The build uses its own pinned Android SDK inside the container.
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker system prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Build pinned Android/Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --file Containerfile --tag tor2-android-builder . 2>&1 | tee "${RUNNER_TEMP}/tor2-docker-build.log"

      - name: Compile Tor VPN and Onionmasq with full diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/tor2-gradle" "${RUNNER_TEMP}/tor2-cargo/registry" "${RUNNER_TEMP}/tor2-cargo/git"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --volume "${RUNNER_TEMP}/tor2-gradle:/root/.gradle" \
            --volume "${RUNNER_TEMP}/tor2-cargo/registry:/root/.cargo/registry" \
            --volume "${RUNNER_TEMP}/tor2-cargo/git:/root/.cargo/git" \
            --workdir /build/vpn \
            tor2-android-builder \
            env BUILD_AAB=0 bash scripts/reproducible_build.sh 2>&1 | tee "${RUNNER_TEMP}/tor2-compile.log"
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tor2-build-diagnostics
          path: |
            ${{ runner.temp }}/tor2-docker-build.log
            ${{ runner.temp }}/tor2-compile.log
          if-no-files-found: warn
          retention-days: 7
