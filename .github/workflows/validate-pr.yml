name: Validate Tor VPN PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tor2-pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, unit tests, lint, and staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify workflow pins and reproducible build scripts
        run: bash scripts/verify_ci_security.sh

      - name: Free unused preinstalled runner disk space
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          for path in /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/boost; do
            timeout 30s sudo rm -rf "$path" || echo "Timed out removing $path; continuing."
          done
          timeout 60s docker system prune --all --force || echo "Docker prune timed out or failed; continuing."
          df -h /

      - name: Build pinned Android/Rust toolchain
        shell: bash
        run: docker build --pull --file Containerfile --tag tor2-android-builder .

      - name: Build pinned Onionmasq and release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tor2-gradle" "${RUNNER_TEMP}/tor2-cargo/registry" "${RUNNER_TEMP}/tor2-cargo/git" "${RUNNER_TEMP}/tor2-maven/repository"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --volume "${RUNNER_TEMP}/tor2-gradle:/root/.gradle" \
            --volume "${RUNNER_TEMP}/tor2-cargo/registry:/root/.cargo/registry" \
            --volume "${RUNNER_TEMP}/tor2-cargo/git:/root/.cargo/git" \
            --volume "${RUNNER_TEMP}/tor2-maven/repository:/root/.m2/repository" \
            --workdir /build/vpn \
            tor2-android-builder \
            env BUILD_AAB=0 bash scripts/reproducible_build.sh

      - name: Run unit tests, ktlint, Android lint, and staging build
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --volume "${RUNNER_TEMP}/tor2-gradle:/root/.gradle" \
            --volume "${RUNNER_TEMP}/tor2-cargo/registry:/root/.cargo/registry" \
            --volume "${RUNNER_TEMP}/tor2-cargo/git:/root/.cargo/git" \
            --volume "${RUNNER_TEMP}/tor2-maven/repository:/root/.m2/repository" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash -lc 'ENFORCE_LOCAL_MAVEN=1 ./gradlew :app:testDebugUnitTest :app:ktlintCheck :app:lintDebug :app:assembleStaging --no-configuration-cache'

      - name: Upload staging APKs for inspection
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tor2-staging-apks
          path: app/build/outputs/apk/staging/**/*.apk
          if-no-files-found: warn
          retention-days: 7
