name: Build Tor VPN Beta APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed APKs as a private GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tor2-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and verify APKs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build pinned Android/Rust toolchain
        run: docker build --pull --file Containerfile --tag tor2-android-builder .

      - name: Compile Tor VPN and Onionmasq
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash scripts/reproducible_build.sh

      - name: Sign APKs with a temporary debug key and verify
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash -lc '
              set -euo pipefail
              shopt -s nullglob
              apks=(build/*-release-unsigned.apk)
              if (( ${#apks[@]} == 0 )); then
                echo "No release APKs were produced." >&2
                exit 1
              fi
              key=/tmp/tor2-debug.keystore
              keytool -genkeypair -noprompt \
                -keystore "$key" -storepass android -alias androiddebugkey \
                -keypass android -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA -keysize 2048 -validity 10000
              for apk in "${apks[@]}"; do
                name="$(basename "${apk%-unsigned.apk}")-debug-signed.apk"
                out="dist/$name"
                mkdir -p dist
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" sign \
                  --ks "$key" --ks-pass pass:android --key-pass pass:android \
                  --out "$out" "$apk"
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$out"
              done
              rm -f "$key"
            '

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: tor2-debug-signed-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK download page
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tor2-build-${{ github.run_number }}
          name: Tor VPN Beta — tor2 build ${{ github.run_number }}
          body: |
            Community-built debug-signed APKs compiled from the source in this private repository.

            These are not official Tor Project releases and are not signed with Tor's release key.
            This is an experimental beta. Do not rely on it for sensitive activity.
          files: dist/*.apk
          fail_on_unmatched_files: true
