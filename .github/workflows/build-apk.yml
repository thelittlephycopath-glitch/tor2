name: Build Tor VPN Beta APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed APKs as a private GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tor2-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and verify APKs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Persist Gradle/Cargo caches between runs. Cache keys include dependency
      # and toolchain inputs, so dependency changes naturally create a new cache.
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tor2-gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/tor2-cargo/registry
            ${{ runner.temp }}/tor2-cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'scripts/oni**', 'scripts/reproducible_build.sh') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pinned Android/Rust toolchain with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          tags: tor2-android-builder:latest
          load: true
          pull: true
          cache-from: type=gha,scope=tor2-toolchain
          cache-to: type=gha,mode=max,scope=tor2-toolchain

      - name: Compile Tor VPN and Onionmasq
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/tor2-gradle" "${{ runner.temp }}/tor2-cargo"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --volume "${{ runner.temp }}/tor2-gradle:/root/.gradle" \
            --volume "${{ runner.temp }}/tor2-cargo:/root/.cargo" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash scripts/reproducible_build.sh

      - name: Sign APKs with an ephemeral debug key and verify signatures
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash -lc '
              set -euo pipefail
              shopt -s nullglob
              apks=(build/*-release-unsigned.apk)
              if (( ${#apks[@]} == 0 )); then
                echo "No release APKs were produced." >&2
                exit 1
              fi
              key=/tmp/tor2-debug.keystore
              keytool -genkeypair -noprompt \
                -keystore "$key" -storepass android -alias androiddebugkey \
                -keypass android -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA -keysize 2048 -validity 10000
              mkdir -p dist
              for apk in "${apks[@]}"; do
                name="$(basename "${apk%-unsigned.apk}")-debug-signed.apk"
                out="dist/$name"
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" sign \
                  --ks "$key" --ks-pass pass:android --key-pass pass:android \
                  --out "$out" "$apk"
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$out"
              done
              rm -f "$key"
            '

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tor2-debug-signed-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK download page
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tor2-build-${{ github.run_number }}
          name: Tor VPN Beta Ã¢ÂÂ tor2 build ${{ github.run_number }}
          body: |
            Community-built debug-signed APKs compiled from the source in this private repository.

            These are not official Tor Project releases and are not signed with Tor's release key.
            This is experimental VPN software. Do not rely on this build for sensitive activity.
          files: dist/*.apk
          fail_on_unmatched_files: true
