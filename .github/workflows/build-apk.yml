name: Build Tor VPN Beta APK

on:
  push:
    branches: [main, dangerous-experiment]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed APKs as a private GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tor2-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and verify APKs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free unused preinstalled runner disk space
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # The build uses its own pinned Android SDK inside the container.
          for path in /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/boost; do
            timeout 30s sudo rm -rf "$path" || echo "Timed out removing $path; continuing."
          done
          timeout 60s docker system prune --all --force || echo "Docker prune timed out or failed; continuing."
          echo "Disk space after cleanup:"
          df -h /

      # Persist only downloaded dependencies. Never mount all of /root/.cargo:
      # that directory also contains rustup/cargo binaries installed in Containerfile.
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tor2-gradle
          key: ${{ runner.os }}-gradle-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore Cargo dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/tor2-cargo/registry
            ${{ runner.temp }}/tor2-cargo/git
          key: ${{ runner.os }}-cargo-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build pinned Android/Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tor2-docker-build.log"
          for attempt in 1 2 3; do
            echo "Docker toolchain build attempt ${attempt}/3"
            if docker build --pull --file Containerfile --tag tor2-android-builder . 2>&1 | tee "$log"; then
              exit 0
            else
              status=${PIPESTATUS[0]}
            fi
            if grep -Eqi '502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|429 Too Many Requests|connection reset|TLS handshake timeout|temporary failure|unexpected EOF|i/o timeout' "$log" && (( attempt < 3 )); then
              delay=$((attempt * 20))
              echo "Transient registry/network failure; retrying in ${delay}s." >&2
              sleep "$delay"
              continue
            fi
            echo "Docker toolchain build failed (exit ${status})." >&2
            exit "$status"
          done
          exit 1

      - name: Compile Tor VPN and Onionmasq
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tor2-gradle" "${RUNNER_TEMP}/tor2-cargo/registry" "${RUNNER_TEMP}/tor2-cargo/git" "${RUNNER_TEMP}/tor2-maven/repository"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --volume "${RUNNER_TEMP}/tor2-gradle:/root/.gradle" \
            --volume "${RUNNER_TEMP}/tor2-cargo/registry:/root/.cargo/registry" \
            --volume "${RUNNER_TEMP}/tor2-cargo/git:/root/.cargo/git" \
            --volume "${RUNNER_TEMP}/tor2-maven/repository:/root/.m2/repository" \
            --workdir /build/vpn \
            tor2-android-builder \
            env BUILD_AAB=0 bash scripts/reproducible_build.sh

      - name: Upload unsigned aligned release APKs for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tor2-unsigned-aligned-apks
          path: build/*-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Sign APKs with an ephemeral debug key and verify signatures
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash -lc '
              set -euo pipefail
              shopt -s nullglob
              apks=(build/*-release-unsigned.apk)
              if (( ${#apks[@]} == 0 )); then
                echo "No release APKs were produced." >&2
                exit 1
              fi
              key=/tmp/tor2-debug.keystore
              keytool -genkeypair -noprompt \
                -keystore "$key" -storepass android -alias androiddebugkey \
                -keypass android -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA -keysize 2048 -validity 10000
              mkdir -p dist
              for apk in "${apks[@]}"; do
                name="$(basename "${apk%-unsigned.apk}")-debug-signed.apk"
                out="dist/$name"
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" sign \
                  --ks "$key" --ks-pass pass:android --key-pass pass:android \
                  --out "$out" "$apk"
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$out"
              done
              rm -f "$key"
            '

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tor2-debug-signed-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests, ktlint, Android lint, and staging build
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --volume "${RUNNER_TEMP}/tor2-gradle:/root/.gradle" \
            --volume "${RUNNER_TEMP}/tor2-maven/repository:/root/.m2/repository" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash -lc 'ENFORCE_LOCAL_MAVEN=1 ./gradlew :app:testDebugUnitTest :app:ktlintCheck :app:lintDebug :app:assembleStaging --no-configuration-cache'

      - name: Boot Android emulator and smoke-test the signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            apk="$(find dist -maxdepth 1 -type f -name '*universal*debug-signed.apk' -print -quit)"
            if [[ -z "$apk" ]]; then
              echo "Universal debug-signed APK was not produced." >&2
              find dist -maxdepth 1 -type f -name '*.apk' -print >&2
              exit 1
            fi
            adb install "$apk"
            adb shell monkey -p org.torproject.vpn.tor2beta.dev 1
            for attempt in $(seq 1 20); do
              if adb shell pidof org.torproject.vpn.tor2beta.dev >/dev/null 2>&1; then
                echo "Tor VPN Beta process started in Android emulator."
                break
              fi
              sleep 2
            done
            if ! adb shell pidof org.torproject.vpn.tor2beta.dev >/dev/null 2>&1; then
              echo "Tor VPN Beta process did not remain alive after launch." >&2
              adb logcat -d -t 500 >&2
              exit 1
            fi
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true

      # The pinned builder runs as root inside Docker. Restore ownership so
      # actions/cache can archive the mounted dependency directories during post-job cleanup.
      - name: Fix dependency cache ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in "${RUNNER_TEMP}/tor2-gradle" "${RUNNER_TEMP}/tor2-cargo/registry" "${RUNNER_TEMP}/tor2-cargo/git" "${RUNNER_TEMP}/tor2-maven/repository"; do
            if [[ -d "$path" ]]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done

      - name: Publish APK download page
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tor2-build-${{ github.run_number }}
          name: Tor VPN Beta - tor2 build ${{ github.run_number }}
          body: |
            Community-built debug-signed APKs compiled from this private repository.

            These are not official Tor Project releases and are not signed with Tor's release key.
            This VPN software is experimental; do not rely on this build for sensitive activity.
          files: dist/*.apk
          fail_on_unmatched_files: true
