name: Build gtor APK

on:
  # APK work is intentionally deferred until the backend/security plan is complete.
  # Run manually when explicitly resuming build verification.
  workflow_dispatch:
    inputs:
      run_apk_build:
        description: Explicitly resume APK build verification (leave false while backend work continues)
        required: true
        type: boolean
        default: false
      publish_release:
        description: Publish signed APKs as a private GitHub Release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tor2-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and verify gtor APKs
    if: ${{ inputs.run_apk_build }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Test and verify CI security preflight
        run: |
          bash -n scripts/test_ci_security.sh
          bash scripts/test_ci_security.sh
          bash scripts/verify_ci_security.sh

      - name: Free unused preinstalled runner disk space
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # The build uses its own pinned Android SDK inside the container.
          for path in /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/boost; do
            timeout 30s sudo rm -rf "$path" || echo "Timed out removing $path; continuing."
          done
          timeout 60s docker system prune --all --force || echo "Docker prune timed out or failed; continuing."
          echo "Disk space after cleanup:"
          df -h /

      # Persist only downloaded dependencies. Never mount all of /root/.cargo:
      # that directory also contains rustup/cargo binaries installed in Containerfile.
      - name: Restore Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: ${{ runner.temp }}/tor2-gradle
          key: ${{ runner.os }}-gradle-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore Cargo dependency cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/tor2-cargo/registry
            ${{ runner.temp }}/tor2-cargo/git
          key: ${{ runner.os }}-cargo-v1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build pinned Android/Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tor2-docker-build.log"
          for attempt in 1 2 3; do
            echo "Docker toolchain build attempt ${attempt}/3"
            if docker build --pull --file Containerfile --tag tor2-android-builder . 2>&1 | tee "$log"; then
              exit 0
            else
              status=${PIPESTATUS[0]}
            fi
            if grep -Eqi '502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|429 Too Many Requests|connection reset|TLS handshake timeout|temporary failure|unexpected EOF|i/o timeout' "$log" && (( attempt < 3 )); then
              delay=$((attempt * 20))
              echo "Transient registry/network failure; retrying in ${delay}s." >&2
              sleep "$delay"
              continue
            fi
            echo "Docker toolchain build failed (exit ${status})." >&2
            exit "$status"
          done
          exit 1

      - name: Compile Tor VPN and Onionmasq
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/tor2-gradle" "${RUNNER_TEMP}/tor2-cargo/registry" "${RUNNER_TEMP}/tor2-cargo/git" "${RUNNER_TEMP}/tor2-maven/repository"
          log="${RUNNER_TEMP}/tor2-build.log"
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --volume "${RUNNER_TEMP}/tor2-gradle:/root/.gradle" \
            --volume "${RUNNER_TEMP}/tor2-cargo/registry:/root/.cargo/registry" \
            --volume "${RUNNER_TEMP}/tor2-cargo/git:/root/.cargo/git" \
            --volume "${RUNNER_TEMP}/tor2-maven/repository:/root/.m2/repository" \
            --workdir /build/vpn \
            tor2-android-builder \
            env BUILD_AAB=0 bash scripts/reproducible_build.sh 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          echo "TOR2_BUILD_EXIT_CODE=$status" | tee "${RUNNER_TEMP}/tor2-build-status.txt"
          exit "$status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gtor-build-diagnostics
          path: |
            ${{ runner.temp }}/tor2-build.log
            ${{ runner.temp }}/tor2-build-status.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Diagnose and preserve APK outputs
        if: always()
        shell: bash
        run: |
          set -eo pipefail
          echo "APK outputs currently present:"
          for directory in build app/build/outputs/apk; do
            if [[ -d "$directory" ]]; then
              find "$directory" -maxdepth 5 -type f -name '*.apk' -print
            fi
          done
          echo "APK alignment/signing is performed inside the pinned builder container."

      - name: Upload APK outputs for inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gtor-apk-build-outputs
          path: |
            build/*-release-unsigned.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/staging/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Sign APKs with an ephemeral debug key and verify signatures
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash -lc '
              set -euo pipefail
              shopt -s nullglob
              apks=(build/*-release-unsigned.apk)
              if (( ${#apks[@]} == 0 )); then
                echo "No release APKs were produced." >&2
                exit 1
              fi
              key=/tmp/gtor-debug.keystore
              keytool -genkeypair -noprompt \
                -keystore "$key" -storepass android -alias androiddebugkey \
                -keypass android -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA -keysize 2048 -validity 10000
              mkdir -p dist
              for apk in "${apks[@]}"; do
                name="$(basename "${apk%-unsigned.apk}")-debug-signed.apk"
                out="dist/$name"
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" sign \
                  --ks "$key" --ks-pass pass:android --key-pass pass:android \
                  --out "$out" "$apk"
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$out"
              done
              rm -f "$key"
            '

      - name: Run unit tests, ktlint, Android lint, and staging build
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --volume "${RUNNER_TEMP}/tor2-gradle:/root/.gradle" \
            --volume "${RUNNER_TEMP}/tor2-maven/repository:/root/.m2/repository" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash -lc 'ENFORCE_LOCAL_MAVEN=1 ./gradlew :app:testDebugUnitTest :app:ktlintCheck :app:lintDebug :app:assembleStaging --no-configuration-cache'

      - name: Set up Java for Android emulator tooling
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tooling
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Boot Android emulator and smoke-test the signed APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            apk="$(find dist -maxdepth 1 -type f -name '*universal*debug-signed.apk' -print -quit)"
            if [[ -z "$apk" ]]; then
              echo "Universal debug-signed APK was not produced." >&2
              find dist -maxdepth 1 -type f -name '*.apk' -print >&2
              exit 1
            fi
            adb install "$apk"
            adb shell monkey -p org.torproject.vpn.tor2beta.dev 1
            for attempt in $(seq 1 20); do
              if adb shell pidof org.torproject.vpn.tor2beta.dev >/dev/null 2>&1; then
                echo "gtor process started in Android emulator."
                break
              fi
              sleep 2
            done
            if ! adb shell pidof org.torproject.vpn.tor2beta.dev >/dev/null 2>&1; then
              echo "gtor process did not remain alive after launch." >&2
              adb logcat -d -t 500 >&2
              exit 1
            fi
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true

      - name: Verify APK metadata and write checksums
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash -lc '
              set -euo pipefail
              shopt -s nullglob
              apks=(dist/*.apk)
              if (( ${#apks[@]} == 0 )); then
                echo "No signed APKs exist for metadata verification." >&2
                exit 1
              fi
              : > dist/BUILD-METADATA.txt
              for apk in "${apks[@]}"; do
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$apk"
                package="$( "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging "$apk" | sed -n "s/^package: name=\\x27\\([^\\x27]*\\)\\x27.*/\\1/p" | head -n 1 )"
                if [[ "$package" != "org.torproject.vpn.tor2beta.dev" ]]; then
                  echo "Unexpected package ID for $apk: $package" >&2
                  exit 1
                fi
                printf "APK: %s\\nPackage: %s\\nSize-bytes: %s\\n\\n" "$apk" "$package" "$(stat -c %s "$apk")" | tee -a dist/BUILD-METADATA.txt
              done
              (cd dist && sha256sum *.apk > SHA256SUMS)
              cat dist/SHA256SUMS
            '

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gtor-debug-signed-apks
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/BUILD-METADATA.txt
          if-no-files-found: error
          retention-days: 14

      # The pinned builder runs as root inside Docker. Restore ownership so
      # actions/cache can archive the mounted dependency directories during post-job cleanup.
      - name: Fix dependency cache ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in "${RUNNER_TEMP}/tor2-gradle" "${RUNNER_TEMP}/tor2-cargo/registry" "${RUNNER_TEMP}/tor2-cargo/git" "${RUNNER_TEMP}/tor2-maven/repository"; do
            if [[ -d "$path" ]]; then
              sudo chown -R "$(id -u):$(id -g)" "$path"
            fi
          done


  publish:
    name: Publish verified APKs from main
    needs: build
    # Publishing must be an explicit manual dispatch on main; pushes never publish debug-signed APKs.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gtor-debug-signed-apks
          path: dist

      - name: Publish APK download page
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: gtor-build-${{ github.run_number }}
          name: gtor build ${{ github.run_number }}
          body: |
            Community-built debug-signed APKs compiled from this private repository.

            These are not official Tor Project releases and are not signed with Tor's release key.
            This VPN software is experimental; do not rely on this build for sensitive activity.
          files: |
            dist/*.apk
            dist/SHA256SUMS
            dist/BUILD-METADATA.txt
          fail_on_unmatched_files: true
