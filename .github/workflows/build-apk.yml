name: Build Tor VPN Beta APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed APKs as a private GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tor2-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, and verify APKs
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free unused preinstalled runner disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          # The build uses its own pinned Android SDK inside the container.
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /usr/local/share/boost
          docker system prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /

      # Persist only downloaded dependencies. Never mount all of /root/.cargo:
      # that directory also contains rustup/cargo binaries installed in Containerfile.
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tor2-gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/*.toml', 'settings.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore Cargo dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/tor2-cargo/registry
            ${{ runner.temp }}/tor2-cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'scripts/oni*', 'scripts/reproducible_build.sh') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build pinned Android/Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/tor2-docker-build.log"
          for attempt in 1 2 3; do
            echo "Docker toolchain build attempt ${attempt}/3"
            if docker build --pull --file Containerfile --tag tor2-android-builder . 2>&1 | tee "$log"; then
              exit 0
            else
              status=${PIPESTATUS[0]}
            fi
            if grep -Eqi '502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|429 Too Many Requests|connection reset|TLS handshake timeout|temporary failure|unexpected EOF|i/o timeout' "$log" && (( attempt < 3 )); then
              delay=$((attempt * 20))
              echo "Transient registry/network failure; retrying in ${delay}s." >&2
              sleep "$delay"
              continue
            fi
            echo "Docker toolchain build failed (exit ${status})." >&2
            exit "$status"
          done
          exit 1

      - name: Compile Tor VPN and Onionmasq
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tor2-gradle" "${RUNNER_TEMP}/tor2-cargo/registry" "${RUNNER_TEMP}/tor2-cargo/git" "${RUNNER_TEMP}/tor2-maven/repository"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --volume "${RUNNER_TEMP}/tor2-gradle:/root/.gradle" \
            --volume "${RUNNER_TEMP}/tor2-cargo/registry:/root/.cargo/registry" \
            --volume "${RUNNER_TEMP}/tor2-cargo/git:/root/.cargo/git" \
            --volume "${RUNNER_TEMP}/tor2-maven/repository:/root/.m2/repository" \
            --workdir /build/vpn \
            tor2-android-builder \
            env BUILD_AAB=0 bash scripts/reproducible_build.sh

      - name: Upload unsigned aligned release APKs for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tor2-unsigned-aligned-apks
          path: build/*-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Sign APKs and verify install metadata
        shell: bash
        env:
          TOR2_SIGNING_KEYSTORE_BASE64: ${{ secrets.TOR2_SIGNING_KEYSTORE_BASE64 }}
          TOR2_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.TOR2_SIGNING_KEYSTORE_PASSWORD }}
          TOR2_SIGNING_KEY_ALIAS: ${{ secrets.TOR2_SIGNING_KEY_ALIAS }}
          TOR2_SIGNING_KEY_PASSWORD: ${{ secrets.TOR2_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e "TOR2_SIGNING_KEYSTORE_BASE64=${TOR2_SIGNING_KEYSTORE_BASE64:-}" \
            -e "TOR2_SIGNING_KEYSTORE_PASSWORD=${TOR2_SIGNING_KEYSTORE_PASSWORD:-}" \
            -e "TOR2_SIGNING_KEY_ALIAS=${TOR2_SIGNING_KEY_ALIAS:-}" \
            -e "TOR2_SIGNING_KEY_PASSWORD=${TOR2_SIGNING_KEY_PASSWORD:-}" \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash -lc '
              set -euo pipefail
              shopt -s nullglob
              apks=(build/*-release-unsigned.apk)
              if (( ${#apks[@]} == 0 )); then
                echo "No release APKs were produced." >&2
                exit 1
              fi

              key=/tmp/tor2-beta.keystore
              if [[ -n "${TOR2_SIGNING_KEYSTORE_BASE64:-}" ]]; then
                : "${TOR2_SIGNING_KEYSTORE_PASSWORD:?TOR2_SIGNING_KEYSTORE_PASSWORD secret is required}"
                : "${TOR2_SIGNING_KEY_ALIAS:?TOR2_SIGNING_KEY_ALIAS secret is required}"
                : "${TOR2_SIGNING_KEY_PASSWORD:?TOR2_SIGNING_KEY_PASSWORD secret is required}"
                printf "%s" "$TOR2_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key"
                ks_args=(--ks "$key" --ks-pass "pass:$TOR2_SIGNING_KEYSTORE_PASSWORD" --ks-key-alias "$TOR2_SIGNING_KEY_ALIAS" --key-pass "pass:$TOR2_SIGNING_KEY_PASSWORD")
                signing_mode="persistent repository beta signing key"
              else
                keytool -genkeypair -noprompt \
                  -keystore "$key" -storepass android -alias androiddebugkey \
                  -keypass android -dname "CN=Tor VPN Beta Debug,O=Community Build,C=BD" \
                  -keyalg RSA -keysize 2048 -validity 10000
                ks_args=(--ks "$key" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android)
                signing_mode="temporary CI debug key; reinstalling over another build may require removing the previous beta first"
                echo "::warning::No persistent signing key configured. To allow upgrades across CI builds, set TOR2_SIGNING_KEYSTORE_BASE64, TOR2_SIGNING_KEYSTORE_PASSWORD, TOR2_SIGNING_KEY_ALIAS, and TOR2_SIGNING_KEY_PASSWORD as GitHub Actions secrets."
              fi

              mkdir -p dist
              for apk in "${apks[@]}"; do
                filename="$(basename "$apk")"
                variant="${filename#app-}"
                variant="${variant%-release-unsigned.apk}"
                if [[ "$variant" == "$filename" || -z "$variant" ]]; then
                  echo "Unexpected APK filename: $filename" >&2
                  exit 1
                fi
                out="dist/TorVPN-Beta-$variant.apk"
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" sign \
                  "${ks_args[@]}" --out "$out" "$apk"
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$out"
                echo "APK metadata for $(basename "$out"):"
                "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt" dump badging "$out" \
                  | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^native-code:"
              done

              cat > dist/INSTALL-INSTRUCTIONS.txt <<EOF
Tor VPN Beta (tor2) — community test build
==========================================

Recommended for most Android phones: TorVPN-Beta-universal.apk
Smaller option for modern ARM64 phones: TorVPN-Beta-arm64-v8a.apk

Install one APK only. Do not install the artifact ZIP itself, and do not use
the unsigned APKs from the inspection artifact.

Package ID: org.torproject.vpn.tor2beta
Signing mode: $signing_mode

This is an experimental community build, not an official Tor Project release.
EOF
              {
                echo "Source commit: $GITHUB_SHA"
                echo "Workflow run: $GITHUB_RUN_ID"
                echo "Signing mode: $signing_mode"
                echo "Package ID: org.torproject.vpn.tor2beta"
              } > dist/BUILD-INFO.txt
              sha256sum dist/*.apk > dist/SHA256SUMS.txt
              rm -f "$key"
            '
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tor2-beta-installable-apks
          path: |
            dist/*.apk
            dist/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests, ktlint, Android lint, and staging build
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/build/vpn" \
            --volume "${RUNNER_TEMP}/tor2-gradle:/root/.gradle" \
            --volume "${RUNNER_TEMP}/tor2-maven/repository:/root/.m2/repository" \
            --workdir /build/vpn \
            tor2-android-builder \
            bash -lc 'ENFORCE_LOCAL_MAVEN=1 ./gradlew :app:testDebugUnitTest :app:ktlintCheck :app:lintDebug :app:assembleStaging --no-configuration-cache'

      - name: Publish APK download page
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tor2-build-${{ github.run_number }}
          name: Tor VPN Beta - tor2 build ${{ github.run_number }}
          body: |
            Community-built experimental APKs from commit ${{ github.sha }}.

            Recommended for most phones: TorVPN-Beta-universal.apk
            Smaller ARM64 option: TorVPN-Beta-arm64-v8a.apk

            These are not official Tor Project releases and are not signed with Tor's release key.
            A persistent community signing key is used only when the four TOR2_SIGNING_* secrets
            are configured. Without them the workflow uses a temporary CI debug key, and Android
            may require removal of an earlier beta build before installing a later build.
            Do not rely on this experimental VPN build for sensitive activity.
          files: |
            dist/*.apk
            dist/INSTALL-INSTRUCTIONS.txt
            dist/BUILD-INFO.txt
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
