[versions]
androidGradlePlugin = "9.4.0"
kotlin = "2.4.10"
kotlinCoroutines = "1.11.0"
constraintlayout = "2.2.2"
composeBom = "2026.08.00"
composeMaterial = "1.5.0-alpha27"
androidTest = "1.7.0"
espressoVersion = "3.7.0"
ksp = "2.3.11"
ktlint = "14.2.0"
leakcanary = "1.0.0"
paging = "3.5.1"
androidxJunit = "1.3.0"
androidxLifecycle = "2.11.0"
navigation = "2.10.0"
navigation3 = "1.1.7"
retrofit = "3.0.0"
room = "3.0.2"
serialization = "1.11.0"
sqlite = "2.7.0"
workRuntimeKtx = "2.11.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-legacy-kapt = { id = "com.android.legacy-kapt", version.ref = "androidGradlePlugin" }
androidx-room3 = { id = "androidx.room3", version.ref = "room" }
androidx-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
jetbrains-kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
jlleitschuh-ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

[libraries]
# Kotlin
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinCoroutines" }

# UI
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.19.0" }
androidx-lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version = "2.2.0" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidxLifecycle" }
androidx-webkit = { module = "androidx.webkit:webkit", version = "1.16.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
material = { module = "com.google.android.material:material", version = "1.14.0" }

lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidxLifecycle" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }

# Compose
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }

# Navigation3
androidx-navigation3-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# Common Tests
androidx-test-core = { module = "androidx.test:core", version.ref = "androidTest" }
androidx-test-ktx = { module = "androidx.test:core-ktx", version.ref = "androidTest" }
android-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-junit-ktx = { module = "androidx.test.ext:junit-ktx", version.ref = "androidxJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoVersion" }
espresso-intents = { module = "androidx.test.espresso:espresso-intents", version.ref = "espressoVersion" }

# Android Test
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.4.0" }
androidx-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espressoVersion" }
screengrab = { module = "tools.fastlane:screengrab", version = "2.1.1" }

# Test
junit = { module = "junit:junit", version = "4.13.2" }
mockk = { module = "io.mockk:mockk", version = "1.14.5" }
androidx-test-truth = { module = "androidx.test.ext:truth", version = "1.7.0" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinCoroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinCoroutines"}
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version = "1.9.25"}

# Debug
leakcanary-android = { module = "com.android.tools.studio.leakcanary:leakcanary", version.ref = "leakcanary" }

# OnionMasq
#noinspection SimilarGradleDependency
onionmasq-release = { module = "org.torproject:onionmasq", version = "1.9.1Beta-local-release" }
#noinspection SimilarGradleDependency
onionmasq-debug = { module = "org.torproject:onionmasq", version = "main-branch-debug" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }

# Room
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
androidx-room3-paging = { module = "androidx.room3:room3-paging", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Paging
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }

[bundles]

retrofit = [
    'retrofit-core',
    'retrofit-kotlinx-serialization'
]

kotlin = [
    'kotlinx-coroutines-android',
    'kotlinx-serialization-json'
]

commonTest = [
    'androidx-test-core',
    'androidx-test-ktx',
    'android-junit',
    'androidx-junit-ktx',
    'espresso-core',
    'espresso-intents',
    'screengrab',
    'kotlinx-coroutines-test',
    'kotlinx-coroutines-core',
    'kotlin-test'
]

androidTest = [
    'androidx-test-runner',
    'androidx-test-uiautomator',
    'androidx-espresso-contrib',
    'androidx-compose-ui-test-junit4',
]

test = [
    'junit',
    'androidx-test-truth',
    'mockk'
]

ui = [
    'lifecycle-viewmodel-ktx',
    'androidx-navigation-fragment-ktx',
    'androidx-navigation-ui-ktx',
    'androidx-lifecycle-livedata-ktx',
    'androidx-core-ktx',
    'androidx-appcompat',
    'androidx-lifecycle-runtime-ktx',
    'androidx-lifecycle-extensions',
    'androidx-constraintlayout',
    'material',
    'androidx-webkit'
]

debug = [
    'leakcanary-android',
    'onionmasq-debug'
]

staging = [
    'onionmasq-debug'
]

release = [
    'onionmasq-release'
]

compose = [
    'androidx-compose-preview',
    'androidx-compose-material3'
]

composeDebug = [
    'androidx-compose-tooling',
    'androidx-compose-test-manifest'
]

navigation3 = [
    'androidx-navigation3-viewmodel',
    'androidx-navigation3-runtime',
    'androidx-navigation3-ui'
]

room3 = [
    'androidx-room3-runtime',
    'androidx-room3-paging',
    'androidx-sqlite-bundled'
]

paging3 = [
    'androidx-paging-compose',
    'androidx-paging-runtime'
]
