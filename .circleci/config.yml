version: 2.1

jobs:
  build-debug-apk:
    docker:
      - image: cimg/android:2025.01.1
    working_directory: ~/project
    environment:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
    steps:
      - checkout
      - run:
          name: Check Java and Android SDK tools
          command: |
            java -version
            ./gradlew --version
            command -v sdkmanager
      - run:
          name: Accept Android SDK licenses
          command: |
            yes | sdkmanager --licenses >/dev/null || true
      - run:
          name: Install Android SDK 37 packages
          command: |
            sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}
            - gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-
      - run:
          name: Build debug APK
          command: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - run:
          name: Run unit tests
          command: ./gradlew --no-daemon :app:testDebugUnitTest
      - save_cache:
          key: gradle-v1-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_artifacts:
          path: app/build/outputs/apk
          destination: apk

workflows:
  android-ci:
    jobs:
      - build-debug-apk
